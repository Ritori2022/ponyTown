events {
    worker_connections 1024;
}

http {
    upstream ponytown_game {
        server ponytown:8090;
    }

    upstream ponytown_admin {
        server ponytown:8091;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=game_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;

    # Main game server
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Max body size for uploads
        client_max_body_size 10M;

        # Logging
        access_log /var/log/nginx/ponytown_access.log;
        error_log /var/log/nginx/ponytown_error.log;

        # WebSocket support
        location /s00/ws {
            proxy_pass http://ponytown_game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Game API and static files
        location / {
            limit_req zone=game_limit burst=20 nodelay;

            proxy_pass http://ponytown_game;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin panel (optional - uncomment if you want separate admin access)
    # server {
    #     listen 8091;
    #     server_name _;
    #
    #     location / {
    #         limit_req zone=admin_limit burst=10 nodelay;
    #
    #         proxy_pass http://ponytown_admin;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # SSL Configuration (uncomment and configure for HTTPS)
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://ponytown_game;
    #         # ... (same proxy settings as above)
    #     }
    # }
}
